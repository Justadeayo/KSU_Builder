name: Save ccache
description: Save the shared ccache directory for a device and kernel branch

inputs:
  device:
    description: Device codename
    required: true
  branch:
    description: Kernel branch
    required: true
  suffix:
    description: Optional key suffix
    required: false
    default: ""
  path:
    description: ccache directory inside the job container
    required: false
    default: /github/home/.ccache

runs:
  using: composite
  steps:
    - uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path }}
        key: ccache-${{ inputs.device }}-${{ inputs.branch }}-${{ github.run_id }}${{ inputs.suffix }}
