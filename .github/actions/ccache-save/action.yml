name: Save kernel ccache
description: "Save the kernel ccache under a unique key. Run it last with if: always(), then prune to the newest entry."
inputs:
  device:
    description: Device codename, for example violet
    required: true
  branch:
    description: Kernel branch, for example 17
    required: true
  suffix:
    description: Optional suffix to keep matrix jobs apart
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.device }}-${{ inputs.branch }}-${{ github.run_id }}${{ inputs.suffix }}
