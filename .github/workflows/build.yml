#
# Builds a device with SUSFS. Every input is optional. An empty input keeps the value
# from builder/devices/<device>.json, so an empty form builds violet exactly as before.
name: Build SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      build_nonksu:
        description: "Also build the non-KSU variant (nsu)"
        required: false
        type: boolean
        default: false
      device_codename:
        description: "Device (devices/<name>.json). Empty = violet"
        required: false
        type: string
        default: ""
      kernel_name:
        description: "Kernel name for the zip name. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_source:
        description: "Kernel repo URL. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_branch:
        description: "Kernel branch. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_version:
        description: "Kernel VERSION.PATCHLEVEL, checked in preflight. Empty = from device JSON"
        required: false
        type: string
        default: ""
      defconfig_name:
        description: "Defconfig target, e.g. vendor/xcalibur-perf_defconfig. Empty = from device JSON"
        required: false
        type: string
        default: ""
      clang_version:
        description: "Clang version, e.g. r596125. Empty = from device JSON"
        required: false
        type: string
        default: ""
      clang_branch:
        description: "googlesource branch for the Clang version. Empty = from device JSON"
        required: false
        type: string
        default: ""
      ak3_repo:
        description: "AnyKernel3 repo URL. Empty = from device JSON"
        required: false
        type: string
        default: ""
      ak3_branch:
        description: "AnyKernel3 branch. Empty = from device JSON"
        required: false
        type: string
        default: ""
      telegram_chat_id:
        description: "Telegram chat ID override. Empty = TELEGRAM_CHAT_ID secret"
        required: false
        type: string
        default: ""
      telegram_bot_token:
        description: "Telegram bot token override. Empty = TELEGRAM_BOT_TOKEN secret"
        required: false
        type: string
        default: ""
      create_release:
        description: "Create a GitHub Release after build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      resolved: ${{ steps.resolve.outputs.resolved }}
      variants: ${{ steps.plan.outputs.variants }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder

      - id: resolve
        name: Resolve device config (inputs over JSON)
        env:
          DEVICE: ${{ inputs.device_codename || 'violet' }}
          IN_KERNEL_NAME: ${{ inputs.kernel_name }}
          IN_KERNEL_REPO: ${{ inputs.kernel_source }}
          IN_KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          IN_KERNEL_VERSION: ${{ inputs.kernel_version }}
          IN_DEFCONFIG: ${{ inputs.defconfig_name }}
          IN_CLANG_VERSION: ${{ inputs.clang_version }}
          IN_CLANG_BRANCH: ${{ inputs.clang_branch }}
          IN_AK3_REPO: ${{ inputs.ak3_repo }}
          IN_AK3_BRANCH: ${{ inputs.ak3_branch }}
        run: |
          set -euo pipefail
          RESOLVED="$(python3 builder/scripts/resolve-device.py builder/devices)"
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan variants
        run: |
          if [ "${{ inputs.build_nonksu }}" = "true" ]; then
            echo 'variants=["ksu","nsu"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["ksu"]' >> "$GITHUB_OUTPUT"
          fi

  notify_start:
    needs: config
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.start.outputs.epoch }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
      RESOLVED: ${{ needs.config.outputs.resolved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder
      - id: start
        run: |
          DEV=$(jq -r .device <<<"$RESOLVED")
          NAME=$(jq -r .kernel_name <<<"$RESOLVED")
          CLANG=$(jq -r .clang_version <<<"$RESOLVED")
          MODE='${{ inputs.build_nonksu && 'BakaSU + non-KSU' || 'BakaSU' }}'
          echo "epoch=$(bash builder/scripts/notify.sh start "$DEV" "$NAME" "$MODE" "clang-$CLANG")" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - config
      - notify_start
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/justadeayo/xcalibur-build-env:ubuntu-24.04-clang-r596125
      options: --cap-add=SYS_ADMIN
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.config.outputs.variants) }}
    env:
      DEVICE: ${{ fromJSON(needs.config.outputs.resolved).device }}
      RESOLVED: ${{ needs.config.outputs.resolved }}
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder

      - name: Set up swap space
        continue-on-error: true
        run: |
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Save resolved device config
        run: printf '%s\n' "$RESOLVED" > resolved.json

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "${{ fromJSON(needs.config.outputs.resolved).kernel_branch }}" \
            "${{ fromJSON(needs.config.outputs.resolved).kernel_repo }}" kernel_src

      - name: Link preinstalled clang
        run: |
          V="clang-${{ fromJSON(needs.config.outputs.resolved).clang_version }}"
          mkdir -p kernel_src/toolchain
          if [ -x "/opt/toolchains/$V/bin/clang" ]; then
            ln -sfn "/opt/toolchains/$V" "kernel_src/toolchain/$V"
          fi

      - name: Restore ccache
        uses: ./builder/.github/actions/ccache-restore
        with:
          device: ${{ env.DEVICE }}
          branch: ${{ fromJSON(needs.config.outputs.resolved).kernel_branch }}

      - name: Reset ccache statistics
        run: bash builder/scripts/ccache-summary.sh reset

      - name: Stage builder files into kernel source
        run: |
          cp -r builder/devices kernel_src/
          cp -r builder/scripts kernel_src/
          cp builder/config.env kernel_src/
          # env.sh and read_field expect {"<device>": {...}}, so wrap the resolved config.
          printf '{"%s": %s}\n' "$DEVICE" "$RESOLVED" > "kernel_src/devices/${DEVICE}.json"

      - name: Preflight — verify declared kernel version
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source scripts/common.sh
          verify_kernel_version "${{ fromJSON(needs.config.outputs.resolved).kernel_version }}"

      - name: Build (${{ env.DEVICE }} / ${{ matrix.variant }})
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source config.env
          source scripts/env.sh "${DEVICE}"
          bash scripts/variant.sh "${DEVICE}" "${{ matrix.variant }}"
          bash scripts/compile.sh "${DEVICE}" "${{ matrix.variant }}"

      - name: Package patch rejects (on failure)
        if: failure()
        working-directory: kernel_src
        run: |
          find . -path ./.xcalibur-xf_deps -prune -o -name '*.rej' -print0 > ../rejects.list
          if [ -s ../rejects.list ]; then
            tar -czf ../patch-rejects.tar.gz --null -T ../rejects.list
          fi

      - name: Upload patch rejects
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcalibur-xf-${{ env.DEVICE }}-${{ matrix.variant }}-rejects
          path: patch-rejects.tar.gz
          if-no-files-found: ignore

      - name: Diagnose known build failures
        if: failure()
        working-directory: kernel_src
        run: |
          LOG="${DEVICE}-${{ matrix.variant }}-build.log"
          if [ -f "$LOG" ]; then
            if grep -q "You disabled CONFIG_KALLSYMS_ALL" "$LOG"; then
              echo "::error::Known issue — BakaSU static-symbol export missing/incomplete. Check ksu.sh's unstatic() block and CONFIG_KALLSYMS/CONFIG_KALLSYMS_ALL."
            fi
            if grep -q "static_export_check.mk" "$LOG"; then
              echo "::error::BakaSU integration check failed — kernel not properly integrated. See https://bakasu.org/guide/manual-integrate"
            fi
          else
            echo "::warning::Build log not found, cannot run diagnosis."
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcalibur-xf-${{ env.DEVICE }}-${{ matrix.variant }}
          path: kernel_src/XCalibur-XF_*.zip
          if-no-files-found: error

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-${{ env.DEVICE }}-${{ matrix.variant }}
          path: |
            kernel_src/*-build.log
            kernel_src/*-config
          if-no-files-found: warn

      - name: Upload KSU version info
        if: matrix.variant == 'ksu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcalibur-xf-${{ env.DEVICE }}-${{ matrix.variant }}-versions
          path: |
            kernel_src/${{ env.DEVICE }}-bakasu-version.txt
            kernel_src/${{ env.DEVICE }}-susfs-version.txt
            kernel_src/${{ env.DEVICE }}-bakasu-managers.txt
          if-no-files-found: error

      - name: CCache summary
        if: always()
        run: bash builder/scripts/ccache-summary.sh report

      - name: Save ccache
        if: always()
        uses: ./builder/.github/actions/ccache-save
        with:
          device: ${{ env.DEVICE }}
          branch: ${{ fromJSON(needs.config.outputs.resolved).kernel_branch }}
          suffix: -${{ matrix.variant }}

  notify_finish:
    needs:
      - config
      - notify_start
      - build
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
      RESOLVED: ${{ needs.config.outputs.resolved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: xcalibur-xf-${{ fromJSON(needs.config.outputs.resolved).device }}-*
          path: zips
      - name: Notify finish
        run: |
          DEV=$(jq -r .device <<<"$RESOLVED")
          NAME=$(jq -r .kernel_name <<<"$RESOLVED")
          CLANG=$(jq -r .clang_version <<<"$RESOLVED")
          bash builder/scripts/notify.sh finish "$DEV" "$NAME" "clang-$CLANG" "${{ needs.notify_start.outputs.epoch }}" \
            "zips/xcalibur-xf-$DEV-ksu/*.zip:BakaSU" \
            "zips/xcalibur-xf-$DEV-nsu/*.zip:non-KSU"

  notify_failed:
    needs:
      - config
      - notify_start
      - build
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
      RESOLVED: ${{ needs.config.outputs.resolved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder
      - name: Notify failure
        run: |
          DEV=$(jq -r .device <<<"$RESOLVED")
          NAME=$(jq -r .kernel_name <<<"$RESOLVED")
          CLANG=$(jq -r .clang_version <<<"$RESOLVED")
          bash builder/scripts/notify.sh fail "$DEV" "$NAME" "clang-$CLANG" "${{ needs.notify_start.outputs.epoch }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release:
    needs:
      - config
      - build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RESOLVED: ${{ needs.config.outputs.resolved }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: xcalibur-xf-*
          path: release_files

      - name: Flatten artifact folders
        run: |
          mkdir -p final
          find release_files -type f -exec mv {} final/ \;

      - name: Compose release notes
        run: |
          {
            echo "> [!NOTE]"

            BAKASU_UNIQUE=$(cat final/*-bakasu-version.txt 2>/dev/null | sort -u)
            SUSFS_UNIQUE=$(cat final/*-susfs-version.txt 2>/dev/null | sort -u)
            MANAGERS_UNIQUE=$(cat final/*-bakasu-managers.txt 2>/dev/null | sort -u)

            [ -n "$BAKASU_UNIQUE" ] && echo "> BakaSU Version: $(echo "$BAKASU_UNIQUE" | head -1)"
            [ -n "$SUSFS_UNIQUE" ] && echo "> SuSFS Version: $(echo "$SUSFS_UNIQUE" | head -1)"
            [ -n "$MANAGERS_UNIQUE" ] && echo "> Supported Managers: $(echo "$MANAGERS_UNIQUE" | head -1)"
            echo ""
            echo "> [!CAUTION]"
            echo "> - Always back up your boot image (and dtbo, if your device has one) before flashing!"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEV=$(jq -r .device <<<"$RESOLVED")
          DATE=$(date +'%Y-%m-%d')
          gh release create "xcalibur-xf-${DEV}-${DATE}-${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --title "XCalibur-XF ${DEV} - ${DATE}" \
            --notes-file release_notes.md \
            final/*.zip

  Cache_Cleanup:
    needs:
      - config
      - build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESOLVED: ${{ needs.config.outputs.resolved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder

      - name: Prune old ccache entries
        run: |
          DEV=$(jq -r .device <<<"$RESOLVED")
          BRANCH=$(jq -r .kernel_branch <<<"$RESOLVED")
          bash builder/scripts/master.sh prune-ccache "ccache-${DEV}-${BRANCH}-"
