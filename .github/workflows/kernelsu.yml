name: KernelSU Kernel Build

on:
  workflow_dispatch:
    inputs:
      device_codename:
        description: "Device to build (Codename)."
        required: false
        type: choice
        options:
          - violet
        default: violet
      kernel_name:
        description: "Kernel name for the zip name. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_source:
        description: "Kernel repo URL. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_branch:
        description: "Kernel branch. Empty = from device JSON"
        required: false
        type: string
        default: ""
      defconfig_name:
        description: "Defconfig target. Empty = from device JSON"
        required: false
        type: string
        default: ""
      clang_version:
        description: "Clang version. default = device JSON (r596125)"
        required: false
        type: choice
        options:
          - default
          - r596125
          - r614150
          - r584948
          - r547379
          - 3289846
        default: default
      ksu_type:
        description: "KernelSU or None"
        required: false
        type: string
        default: "KernelSU"
      susfs:
        description: "Build with SUSFS"
        required: false
        type: boolean
        default: true
      build_manager:
        description: "Also build and attach the KernelSU Manager APK"
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      device_codename:
        required: false
        type: string
        default: ""
      kernel_name:
        required: false
        type: string
        default: ""
      kernel_source:
        required: false
        type: string
        default: ""
      kernel_branch:
        required: false
        type: string
        default: ""
      defconfig_name:
        required: false
        type: string
        default: ""
      clang_version:
        required: false
        type: string
        default: ""
      ksu_type:
        required: false
        type: string
        default: "KernelSU"
      susfs:
        required: false
        type: boolean
        default: true
      build_manager:
        required: false
        type: boolean
        default: false
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

env:
  TZ: "Africa/Lagos"

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      resolved: ${{ steps.resolve.outputs.resolved }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: resolve
        name: Resolve device config (inputs over JSON)
        env:
          DEVICE: ${{ inputs.device_codename || 'violet' }}
          IN_KERNEL_NAME: ${{ inputs.kernel_name }}
          IN_KERNEL_REPO: ${{ inputs.kernel_source }}
          IN_KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          IN_DEFCONFIG: ${{ inputs.defconfig_name }}
          IN_CLANG_VERSION: ${{ inputs.clang_version }}
        run: |
          set -euo pipefail
          RESOLVED="$(python3 scripts/resolve-device.py devices)"
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"

  notify_start:
    needs: config
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.start.outputs.epoch }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEVICE: ${{ fromJSON(needs.config.outputs.resolved).device }}
      KERNEL_NAME: ${{ fromJSON(needs.config.outputs.resolved).kernel_name }}
      KSU_LABEL: ${{ inputs.ksu_type }}
      CLANG: ${{ fromJSON(needs.config.outputs.resolved).clang_version }}
    steps:
      - uses: actions/checkout@v7
      - id: start
        run: echo "epoch=$(bash scripts/notify.sh start "$DEVICE" "$KERNEL_NAME" "$KSU_LABEL" "$CLANG")" >> "$GITHUB_OUTPUT"

  build-manager:
    if: ${{ inputs.build_manager }}
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  build:
    needs: config
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/justadeayo/xcalibur-build-env:ubuntu-24.04-clang-r596125
      options: --cap-add=SYS_ADMIN
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEVICE: ${{ fromJSON(needs.config.outputs.resolved).device }}
      KERNEL_REPO: ${{ fromJSON(needs.config.outputs.resolved).kernel_repo }}
      KERNEL_BRANCH: ${{ fromJSON(needs.config.outputs.resolved).kernel_branch }}
      DEFCONFIG: ${{ fromJSON(needs.config.outputs.resolved).defconfig }}
      KERNEL_NAME: ${{ fromJSON(needs.config.outputs.resolved).kernel_name }}
      CLANG_VERSION: ${{ fromJSON(needs.config.outputs.resolved).clang_version }}
      KSU_TYPE: ${{ inputs.ksu_type }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        continue-on-error: true
        with:
          swap-size-gb: 16

      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          device: ${{ env.DEVICE }}
          branch: ${{ env.KERNEL_BRANCH }}

      - name: Clone kernel source
        run: |
          rm -rf kernel
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Link clang
        run: |
          V="clang-${CLANG_VERSION}"
          mkdir -p toolchains
          if [ -x "/opt/toolchains/$V/bin/clang" ]; then
            ln -sfn "/opt/toolchains/$V" "toolchains/$V"
          else
            bash scripts/master.sh clang "$V" "toolchains/$V"
          fi

      - name: Set up root manager and defconfig
        run: bash scripts/master.sh ksu-setup kernel "$KSU_TYPE" "arch/arm64/configs/$DEFCONFIG" "${{ inputs.susfs }}"

      - name: Reset ccache statistics
        run: bash scripts/ccache-summary.sh reset

      - name: Compile kernel
        env:
          REQUIRE_KSU_TAMPER: ${{ inputs.ksu_type == 'KernelSU' }}
        run: |
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_NOHASHDIR=1
          bash scripts/master.sh compile "clang-$CLANG_VERSION" "$DEFCONFIG" kernel "$GITHUB_WORKSPACE/build.log"

      - name: CCache summary
        if: always()
        run: bash scripts/ccache-summary.sh report

      - name: Package AnyKernel3 zip
        run: |
          ZIP=$(bash scripts/master.sh anykernel "kernel/out/arch/arm64/boot" "$KERNEL_NAME" "$DEVICE" "$KSU_TYPE" "toolchains/clang-$CLANG_VERSION/bin")
          echo "ZIP_NAME=${ZIP%.zip}" >> "$GITHUB_ENV"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v7
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          device: ${{ env.DEVICE }}
          branch: ${{ env.KERNEL_BRANCH }}

  notify_finish:
    needs:
      - config
      - notify_start
      - build
      - build-manager
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEVICE: ${{ fromJSON(needs.config.outputs.resolved).device }}
      KERNEL_NAME: ${{ fromJSON(needs.config.outputs.resolved).kernel_name }}
      CLANG: ${{ fromJSON(needs.config.outputs.resolved).clang_version }}
      EPOCH: ${{ needs.notify_start.outputs.epoch }}
      KSU_LABEL: ${{ inputs.ksu_type }}
    steps:
      - uses: actions/checkout@v7

      - name: Download kernel zip
        uses: actions/download-artifact@v8
        with:
          name: kernel-zip
          path: kernel_out/

      - name: Download manager APK
        if: ${{ needs.build-manager.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: manager
          path: manager_apk/

      - name: Notify finish
        run: bash scripts/notify.sh finish "$DEVICE" "$KERNEL_NAME" "$CLANG" "$EPOCH" "kernel_out/*.zip:$KSU_LABEL" "manager_apk/*.apk:Manager APK"

  notify_failed:
    needs:
      - config
      - notify_start
      - build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEVICE: ${{ fromJSON(needs.config.outputs.resolved).device }}
      KERNEL_NAME: ${{ fromJSON(needs.config.outputs.resolved).kernel_name }}
      CLANG: ${{ fromJSON(needs.config.outputs.resolved).clang_version }}
      EPOCH: ${{ needs.notify_start.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7

      - name: Notify failure
        run: bash scripts/notify.sh fail "$DEVICE" "$KERNEL_NAME" "$CLANG" "$EPOCH" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  cache-cleanup:
    needs:
      - config
      - build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEVICE: ${{ fromJSON(needs.config.outputs.resolved).device }}
      KERNEL_BRANCH: ${{ fromJSON(needs.config.outputs.resolved).kernel_branch }}
    steps:
      - uses: actions/checkout@v7
      - name: Prune old ccache entries
        run: bash scripts/master.sh prune-ccache "ccache-${DEVICE}-${KERNEL_BRANCH}-"
