name: Build Manager

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      RELEASE_KEYSTORE_BASE64:
        required: false
      RELEASE_KEYSTORE_PASSWORD:
        required: false
      RELEASE_KEY_ALIAS:
        required: false
      RELEASE_KEY_PASSWORD:
        required: false
  workflow_dispatch:

# KSU_Builder is checked out to ./builder; the patched KernelSU source goes to ./KernelSU.

jobs:
  generate-key:
    runs-on: ubuntu-24.04
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Extract certificate hash and size
        if: github.event_name == 'pull_request'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

  build-ksud:
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: armv7-linux-androideabi
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout KSU_Builder
        uses: actions/checkout@v7
        with:
          repository: 'Justadeayo/KSU_Builder'
          ref: 'dev'
          path: builder

      - name: Fetch patched KernelSU source
        run: KSU_DEST="$GITHUB_WORKSPACE/KernelSU" bash builder/scripts/ksu-fetch.sh - builder/patches/ksu

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Refresh adb_client pin
        working-directory: KernelSU
        run: cargo update -p adb_client

      - name: Build ksud
        working-directory: KernelSU
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh ${{ matrix.target }} 26
          cargo build --package ksud --target=${{ matrix.target }} --release

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ matrix.target }}
          path: KernelSU/target/${{ matrix.target }}/release/ksud

  build-manager:
    needs: [generate-key]
    if: always() && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./KernelSU/manager

    steps:
      - name: Checkout KSU_Builder
        uses: actions/checkout@v7
        with:
          repository: 'Justadeayo/KSU_Builder'
          ref: 'dev'
          path: builder

      - name: Fetch patched KernelSU source
        working-directory: .
        run: KSU_DEST="$GITHUB_WORKSPACE/KernelSU" bash builder/scripts/ksu-fetch.sh - builder/patches/ksu

      - name: Write key
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?set the RELEASE_KEYSTORE_BASE64 secret}"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo KEYSTORE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$RELEASE_KEY_ALIAS"
            echo KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            echo KEYSTORE_FILE='release.keystore'
          } >> gradle.properties

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='pr-key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease --stacktrace -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease --stacktrace
          fi

      - name: Upload build artifact
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: KernelSU/manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        with:
          name: "mappings"
          path: "KernelSU/manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KSU_Builder
        uses: actions/checkout@v7
        with:
          repository: 'Justadeayo/KSU_Builder'
          ref: 'dev'
          path: builder

      - name: Fetch patched KernelSU source
        run: KSU_DEST="$GITHUB_WORKSPACE/KernelSU" bash builder/scripts/ksu-fetch.sh - builder/patches/ksu

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: KernelSU/artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: KernelSU/artifacts/ksud-aarch64-linux-android

      - name: Download arm ksud
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ksud-armv7-linux-androideabi
          path: KernelSU/artifacts/ksud-armv7-linux-androideabi

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: KernelSU/artifacts/ksud-x86_64-linux-android

      - name: Place manager apk and ksud artifacts
        working-directory: KernelSU
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          mkdir -p target/x86_64-linux-android/release

          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          ARM_KSUD=$(find artifacts/ksud-armv7-linux-androideabi -type f -name ksud 2>/dev/null | head -n 1)

          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"

          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          if [ -n "$ARM_KSUD" ]; then
            cp -f "$ARM_KSUD" target/armv7-linux-androideabi/release/ksud
          fi

      - name: Prepare signing inputs
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?set the RELEASE_KEYSTORE_BASE64 secret}"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > KernelSU/manager/release.keystore
          echo "SIGN_KEYSTORE_FILE=manager/release.keystore" >> $GITHUB_ENV
          echo "SIGN_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> $GITHUB_ENV
          echo "SIGN_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SIGN_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Repack and resign
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        working-directory: KernelSU
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Upload build artifact
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: KernelSU/dist/*.apk
