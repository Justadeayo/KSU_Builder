name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci", "test", "staging" ]
  workflow_call:
    inputs:
      telegram_chat_id:
        required: false
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-22.04
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate temporary keystore
        if: github.event_name == 'pull_request'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Extract certificate hash and size
        if: github.event_name == 'pull_request'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

  build-ksuinit:
    needs: generate-key
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4
        with:
          repository: 'Justadeayo/KernelSU'
          ref: 'master'
          fetch-depth: 0

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Build ksuinit
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo build --package ksuinit --target=aarch64-linux-android --release

      - name: Upload ksuinit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksuinit-aarch64
          path: target/aarch64-linux-android/release/ksuinit

  build-ksud:
    needs: [build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
            pack_ksuinit: true
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            pack_ksuinit: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4
        with:
          repository: 'Justadeayo/KernelSU'
          ref: 'master'
          fetch-depth: 0

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-targets: false

      - name: Download ksuinit artifact
        if: ${{ matrix.pack_ksuinit }}
        uses: actions/download-artifact@v4
        with:
          name: ksuinit-aarch64
          path: userspace/ksud/src/assets/

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh ${{ matrix.target }} 26
          cargo build --package ksud --target=${{ matrix.target }} --release

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksud-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ksud

  build-manager:
    needs: [generate-key]
    if: always() && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4
        with:
          repository: 'Justadeayo/KernelSU'
          ref: 'master'
          fetch-depth: 0
          fetch-tags: true

      - name: Set Custom Base Version Tag
        run: |
          git config user.name "Justus"
          git config user.email "Justadeayo@users.noreply.github.com"
          git tag -f "v3.3.0" || git tag -a "v3.3.0" -m "Base release tag" HEAD~1 2>/dev/null

      - name: Write key
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        run: |
            {
              echo KEYSTORE_PASSWORD='password'
              echo KEY_ALIAS='alias'
              echo KEY_PASSWORD='password'
              echo KEYSTORE_FILE='dummy.keystore'
            } >> gradle.properties

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='pr-key.jks'
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Repositories to Justadeayo
        run: |
          find app/src/ -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle*" \) -exec sed -i 's|backslashxx/KernelSU|Justadeayo/KernelSU|g' {} +

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease --stacktrace -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease --stacktrace
          fi

      - name: Upload build artifact
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        uses: actions/upload-artifact@v4
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        with:
          name: "mappings"
          path: "manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4
        with:
          repository: 'Justadeayo/KernelSU'
          ref: 'master'
          fetch-depth: 0
          fetch-tags: true

      - name: Set Custom Base Version Tag
        run: |
          git config user.name "Justus"
          git config user.email "Justadeayo@users.noreply.github.com"
          git tag -f "v3.3.0" || git tag -a "v3.3.0" -m "Base release tag" HEAD~1 2>/dev/null

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v4
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v4
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download arm ksud
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARM_KSUD=$(find artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$ARM_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$ARM_KSUD" target/armv7-linux-androideabi/release/ksud

      - name: Prepare signing inputs
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        run: |
          echo "SIGN_KEYSTORE_FILE=manager/dummy.keystore" >> $GITHUB_ENV
          echo "SIGN_KEY_ALIAS=alias" >> $GITHUB_ENV
          echo "SIGN_KEYSTORE_PASSWORD=password" >> $GITHUB_ENV
          echo "SIGN_KEY_PASSWORD=password" >> $GITHUB_ENV

      - name: Repack and resign
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Upload build artifact
        if: ${{ github.event_name != 'pull_request' || github.ref_type == 'tag' || github.event_name == 'workflow_call' }}
        uses: actions/upload-artifact@v4
        with:
          name: manager
          path: dist/*.apk
