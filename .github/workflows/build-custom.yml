#
# Standalone copy of build.yml that takes inputs like the kernel workflows.
# Every input is optional. An empty input keeps the value from
# builder/devices/<device>.json, so an empty form gives the same build as build.yml.
name: Build Custom SUSFS Kernel

on:
  workflow_dispatch:
    inputs:
      device_codename:
        description: "Device (devices/<name>.json). Empty = violet"
        required: false
        type: string
        default: ""
      kernel_name:
        description: "Kernel name for the zip name. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_source:
        description: "Kernel repo URL. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_branch:
        description: "Kernel branch. Empty = from device JSON"
        required: false
        type: string
        default: ""
      kernel_version:
        description: "Kernel VERSION.PATCHLEVEL, checked in preflight. Empty = from device JSON"
        required: false
        type: string
        default: ""
      defconfig_name:
        description: "Defconfig target, e.g. vendor/xcalibur-perf_defconfig. Empty = from device JSON"
        required: false
        type: string
        default: ""
      clang_version:
        description: "Clang version, e.g. clang-r596125. Empty = from device JSON"
        required: false
        type: string
        default: ""
      clang_branch:
        description: "googlesource branch for the Clang version. Empty = from device JSON"
        required: false
        type: string
        default: ""
      ak3_repo:
        description: "AnyKernel3 repo URL. Empty = from device JSON"
        required: false
        type: string
        default: ""
      ak3_branch:
        description: "AnyKernel3 branch. Empty = from device JSON"
        required: false
        type: string
        default: ""
      telegram_chat_id:
        description: "Telegram chat ID override. Empty = TELEGRAM_CHAT_ID secret"
        required: false
        type: string
        default: ""
      telegram_bot_token:
        description: "Telegram bot token override. Empty = TELEGRAM_BOT_TOKEN secret"
        required: false
        type: string
        default: ""
      create_release:
        description: "Create a GitHub Release after build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [ksu, nsu]
    env:
      DEVICE: ${{ inputs.device_codename || 'violet' }}
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: builder

      - name: Set up swap space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c  # v1.0
        with:
          swap-size-gb: 10

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio flex bison libssl-dev \
            libelf-dev dwarves zip curl git python3 rsync jq ccache

      - name: Resolve device config (inputs over JSON)
        id: devcfg
        env:
          IN_KERNEL_NAME: ${{ inputs.kernel_name }}
          IN_KERNEL_REPO: ${{ inputs.kernel_source }}
          IN_KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          IN_KERNEL_VERSION: ${{ inputs.kernel_version }}
          IN_DEFCONFIG: ${{ inputs.defconfig_name }}
          IN_CLANG_VERSION: ${{ inputs.clang_version }}
          IN_CLANG_BRANCH: ${{ inputs.clang_branch }}
          IN_AK3_REPO: ${{ inputs.ak3_repo }}
          IN_AK3_BRANCH: ${{ inputs.ak3_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          dev = os.environ["DEVICE"]
          path = f"builder/devices/{dev}.json"
          if not os.path.isfile(path):
              raise SystemExit(f"::error::No device config at {path}. Add it or leave device_codename empty.")

          cfg = json.load(open(path))[dev]

          # Empty input = keep the JSON value.
          overrides = {
              "kernel_name":    "IN_KERNEL_NAME",
              "kernel_repo":    "IN_KERNEL_REPO",
              "kernel_branch":  "IN_KERNEL_BRANCH",
              "kernel_version": "IN_KERNEL_VERSION",
              "defconfig":      "IN_DEFCONFIG",
              "clang_version":  "IN_CLANG_VERSION",
              "clang_branch":   "IN_CLANG_BRANCH",
              "ak3_repo":       "IN_AK3_REPO",
              "ak3_branch":     "IN_AK3_BRANCH",
          }
          applied = []
          for key, env_name in overrides.items():
              value = os.environ.get(env_name, "").strip()
              if value:
                  cfg[key] = value
                  applied.append(key)

          json.dump({dev: cfg}, open("resolved.json", "w"), indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key in ("kernel_repo", "kernel_branch", "clang_version", "kernel_version"):
                  out.write(f"{key}={cfg[key]}\n")

          print(f"Device: {dev}")
          print("Inputs applied over JSON: " + (", ".join(applied) if applied else "none"))
          PY

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b "${{ steps.devcfg.outputs.kernel_branch }}" \
            "${{ steps.devcfg.outputs.kernel_repo }}" kernel_src

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: kernel_src/toolchain/clang-${{ steps.devcfg.outputs.clang_version }}
          key: toolchain-clang-${{ steps.devcfg.outputs.clang_version }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: ccache-${{ env.DEVICE }}-${{ matrix.variant }}
          max-size: 2G
          create-symlink: false

      - name: Stage builder files into kernel source
        run: |
          cp -r builder/devices kernel_src/
          cp -r builder/scripts kernel_src/
          cp builder/config.env kernel_src/
          # Put the resolved config (inputs applied) in place of the device JSON.
          cp resolved.json "kernel_src/devices/${DEVICE}.json"

      - name: Preflight — verify declared kernel version
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source scripts/common.sh
          verify_kernel_version "${{ steps.devcfg.outputs.kernel_version }}"

      - name: Build (${{ env.DEVICE }} / ${{ matrix.variant }})
        working-directory: kernel_src
        run: |
          set -euo pipefail
          source config.env
          source scripts/env.sh "${DEVICE}"
          bash scripts/variant.sh "${DEVICE}" "${{ matrix.variant }}"
          bash scripts/compile.sh "${DEVICE}" "${{ matrix.variant }}"

      - name: Package patch rejects (on failure)
        if: failure()
        working-directory: kernel_src
        run: |
          find . -path ./.xcalibur-xf_deps -prune -o -name '*.rej' -print0 > ../rejects.list
          if [ -s ../rejects.list ]; then
            tar -czf ../patch-rejects.tar.gz --null -T ../rejects.list
          fi

      - name: Upload patch rejects
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcalibur-xf-${{ env.DEVICE }}-${{ matrix.variant }}-rejects
          path: patch-rejects.tar.gz
          if-no-files-found: ignore

      - name: Diagnose known build failures
        if: failure()
        working-directory: kernel_src
        run: |
          LOG="${DEVICE}-${{ matrix.variant }}-build.log"
          if [ -f "$LOG" ]; then
            if grep -q "You disabled CONFIG_KALLSYMS_ALL" "$LOG"; then
              echo "::error::Known issue — KernelSU static-symbol export missing/incomplete. Check ksu.sh's unstatic() block and CONFIG_KALLSYMS/CONFIG_KALLSYMS_ALL."
            fi
            if grep -q "static_export_check.mk" "$LOG"; then
              echo "::error::KernelSU integration check failed — kernel not properly integrated. See https://github.com/Justadeayo/KernelSU"
            fi
          else
            echo "::warning::Build log not found, cannot run diagnosis."
          fi

      - name: Upload flashable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcalibur-xf-${{ env.DEVICE }}-${{ matrix.variant }}
          path: kernel_src/xcalibur-xf-*.zip
          if-no-files-found: error

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-${{ env.DEVICE }}-${{ matrix.variant }}
          path: |
            kernel_src/*-build.log
            kernel_src/*-config
          if-no-files-found: warn

      - name: Upload KSU version info
        if: matrix.variant == 'ksu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: xcalibur-xf-${{ env.DEVICE }}-${{ matrix.variant }}-versions
          path: |
            kernel_src/${{ env.DEVICE }}-ksu-version.txt
            kernel_src/${{ env.DEVICE }}-susfs-version.txt
            kernel_src/${{ env.DEVICE }}-ksu-managers.txt
          if-no-files-found: error

      - name: Send flashable zip to Telegram
        if: success()
        run: |
          ZIP=$(ls kernel_src/xcalibur-xf-*.zip | head -1)
          CAPTION="*${{ inputs.kernel_name || 'XCalibur-XF' }} build ✅*

          *Device*: \`${DEVICE}\`
          *Variant*: \`${{ matrix.variant }}\`
          *Run*: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bash builder/scripts/master.sh tg-doc "$ZIP" "$CAPTION"

      - name: Send failure report to Telegram
        if: failure()
        run: |
          LOG="kernel_src/${DEVICE}-${{ matrix.variant }}-build.log"
          MSG="*XCalibur-XF build failed ❌*

          *Device*: \`${DEVICE}\`
          *Variant*: \`${{ matrix.variant }}\`
          *Run*: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f "$LOG" ]; then
            tail -n 35 "$LOG" > error_preview.txt
            zip -j error_logs.zip "$LOG" error_preview.txt
            bash builder/scripts/master.sh tg-doc error_logs.zip "$MSG"
          else
            bash builder/scripts/master.sh tg-msg "$MSG"
          fi

  release:
    needs: build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: xcalibur-xf-*
          path: release_files

      - name: Flatten artifact folders
        run: |
          mkdir -p final
          find release_files -type f -exec mv {} final/ \;

      - name: Compose release notes
        run: |
          {
            echo "> [!NOTE]"
            KSU_UNIQUE=$(cat final/*-ksu-version.txt 2>/dev/null | sort -u)
            SUSFS_UNIQUE=$(cat final/*-susfs-version.txt 2>/dev/null | sort -u)
            KSU_SOURCE_UNIQUE=$(cat final/*-ksu-managers.txt 2>/dev/null | sort -u)
            [ -n "$KSU_UNIQUE" ] && echo "> KernelSU Version: $(echo "$KSU_UNIQUE" | head -1)"
            [ -n "$SUSFS_UNIQUE" ] && echo "> SuSFS Version: $(echo "$SUSFS_UNIQUE" | head -1)"
            [ -n "$KSU_SOURCE_UNIQUE" ] && echo "> KernelSU source: $(echo "$KSU_SOURCE_UNIQUE" | head -1)"
            echo ""
            echo "> [!CAUTION]"
            echo "> - Always back up your boot image (and dtbo, if your device has one) before flashing!"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          gh release create "xcalibur-xf-${DATE}-${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --title "XCalibur-XF build - ${DATE}" \
            --notes-file release_notes.md \
            final/*.zip
