name: Build Env Image

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/build-env/**"
      - ".github/workflows/build-env.yml"

permissions:
  contents: read
  packages: write

env:
  CLANG_VERSION: "clang-r596125"
  IMAGE: "ghcr.io/justadeayo/xcalibur-build-env"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/build-env
          push: true
          build-args: CLANG_VERSION=${{ env.CLANG_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.CLANG_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
