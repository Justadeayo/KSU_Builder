name: Sync Upstream Updates

on:
  workflow_dispatch:
    inputs:
      trigger_release:
        description: 'Trigger release.yml after successful sync'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      trigger_release:
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write 
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: Justadeayo/KernelSU
          token: ${{ secrets.SYNC_PAT }}
          ref: master
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config --global user.name "Justus"
          git config --global user.email "Justadeayo@users.noreply.github.com"

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/backslashxx/KernelSU.git
          git fetch upstream

      - name: Sync and Align History
        run: |
          UPSTREAM_BRANCH="master"
          if git show-ref --quiet refs/remotes/upstream/main; then
            UPSTREAM_BRANCH="main"
          fi

          echo "Comparing local master with upstream/$UPSTREAM_BRANCH..."

          if git merge-base --is-ancestor upstream/$UPSTREAM_BRANCH HEAD; then
            echo "✅ master is already up to date. Skipping sync."
            echo "SYNC_NEEDED=false" >> $GITHUB_ENV
          else
            echo "🔄 Upstream has new changes. Aligning master perfectly with upstream..."
            git reset --hard upstream/$UPSTREAM_BRANCH
            echo "SYNC_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Push updates
        if: env.SYNC_NEEDED == 'true'
        run: |
          git push origin master --force

      - name: Trigger Release Workflow for Violet
        if: env.SYNC_NEEDED == 'true' && inputs.trigger_release == true
        run: |
          gh workflow run release.yml -R Justadeayo/KSU_Builder --ref dev
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
