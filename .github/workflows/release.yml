name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      is_prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/kernelsu.yml
    with:
      build_manager: true
    secrets: inherit

  release:
    needs:
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

 
      - name: Read build versions
        run: |
          set -euo pipefail
          source config.env
          echo "NOMOUNT_TAG=${NOMOUNT_TAG}" >> "$GITHUB_ENV"
          rm -rf /tmp/susfs-ver && git init -q /tmp/susfs-ver
          git -C /tmp/susfs-ver remote add origin "$SUSFS_REPO_URL"
          git -C /tmp/susfs-ver fetch -q --depth 1 origin "$SUSFS_REPO_PIN"
          SUSFS_VER="$(git -C /tmp/susfs-ver show FETCH_HEAD:Patches/Patch/susfs_patch_to_4.14.patch | grep -m1 -o 'define SUSFS_VERSION "[^"]*"' | grep -o 'v[0-9.]*')"
          [ -n "$SUSFS_VER" ] || { echo "::error::could not read SUSFS_VERSION"; exit 1; }
          echo "SUSFS_VERSION=${SUSFS_VER}" >> "$GITHUB_ENV"

      - name: Generate and Push Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION_TAG="${{ github.ref_name }}"
          else
            OFFSET=3
            RUN_NUM=${{ github.run_number }}
            TAG_BUILD=$((OFFSET + RUN_NUM))
            VERSION_TAG="v3.3.1-${TAG_BUILD}"
            
            git config user.name "Justus"
            git config user.email "Justadeayo@users.noreply.github.com"
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG"
          fi

          echo "TAG_NAME=${VERSION_TAG}" >> $GITHUB_ENV

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets/

      - name: Determine Release Configuration
        id: config
        run: |
          INPUT_VAL="${{ inputs.is_prerelease }}"
          
          if [ -n "$INPUT_VAL" ]; then
            IS_PRE="$INPUT_VAL"
          elif [ "${{ github.event_name }}" = "push" ]; then
            IS_PRE="false"
          else
            IS_PRE="true"
          fi

          echo "IS_PRERELEASE=${IS_PRE}" >> $GITHUB_ENV

          ZIP_PATH=$(find release_assets -name "*.zip" | head -n 1)
          if [ -n "$ZIP_PATH" ]; then
            ZIP_NAME=$(basename "$ZIP_PATH")
            
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/${ZIP_NAME}"
            echo "ZIP_URL=${DOWNLOAD_URL}" >> $GITHUB_ENV
          else
            echo "ZIP_URL=No zip file generated" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          generate_release_notes: false
          body: |
            * Included SUSFS ${{ env.SUSFS_VERSION }}
            * Added support for ${{ env.NOMOUNT_TAG }} NoMount meta modules
            * Added Eruda debugging for modules WebUI
            * Synced with upstream changes.
            * Other Improvement to kernel side
            **Kernel:** XCalibur-XF       
            **KernelSU:** v3.3.1+
            **Kernel Zip:** ${{ env.ZIP_URL }}
            
            ~by Justadeayo🎖️
          files: |
            release_assets/manager/*.apk
            release_assets/**/*.zip
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}