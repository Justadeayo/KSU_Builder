name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: Kernel name (used in the zip file name)
        required: true
        type: string
        default: "XCalibur-XF"

      device_codename:
        description: Device codename
        required: true
        type: string
        default: "violet"

      kernel_source:
        description: Kernel source repo URL
        required: true
        type: string

      kernel_branch:
        description: Kernel source branch
        required: true
        type: string

      defconfig_name:
        description: Defconfig file name, e.g. violet_defconfig
        required: true
        type: string

      clang_version:
        description: Clang toolchain version
        required: true
        type: choice
        options:
          - clang-r596125
          - clang-r416183b
          - clang-r563880
          - clang-r563880c
          - clang-r574158
          - clang-stable
        default: "clang-r596125"

      ksu_type:
        description: Root manager (KernelSU tracks tiann/KernelSU main; Uni-SU also accepts other managers)
        required: true
        type: choice
        options:
          - KernelSU
          - Uni-SU
          - None
        default: KernelSU

      upload_raw_outputs:
        description: Also upload the raw kernel images (Image, dtb, dtbo) as an artifact
        required: false
        type: boolean
        default: false

env:
  TZ: "Africa/Lagos"

jobs:
  notify_start:
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.start.outputs.epoch }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - id: start
        run: echo "epoch=$(bash scripts/notify.sh start '${{ inputs.device_codename }}' '${{ inputs.kernel_name }}' '${{ inputs.ksu_type }}' '${{ inputs.clang_version }}')" >> "$GITHUB_OUTPUT"

  Kernel_CI:
    needs: notify_start
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/justadeayo/xcalibur-build-env:ubuntu-24.04-clang-r596125
      options: --cap-add=SYS_ADMIN
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      checks: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup swap
        uses: pierotofy/set-swap-space@master
        continue-on-error: true
        with:
          swap-size-gb: 16

      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          device: ${{ inputs.device_codename }}
          branch: ${{ inputs.kernel_branch }}

      - name: Clone kernel source
        run: |
          rm -rf kernel
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source }}" kernel

      - name: Prepare clang
        run: |
          V="${{ inputs.clang_version }}"
          mkdir -p toolchains
          if [ -x "/opt/toolchains/$V/bin/clang" ]; then
            ln -sfn "/opt/toolchains/$V" "toolchains/$V"
          else
            bash scripts/master.sh clang "$V" "toolchains/$V"
          fi

      - name: Setup root manager and configure defconfig
        run: |
          bash scripts/master.sh ksu-setup kernel "${{ inputs.ksu_type }}" "arch/arm64/configs/${{ inputs.defconfig_name }}"

      - name: Reset ccache statistics
        run: bash scripts/ccache-summary.sh reset

      - name: Compile kernel
        env:
          REQUIRE_KSU_TAMPER: ${{ inputs.ksu_type == 'KernelSU' }}
        run: |
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_NOHASHDIR=1
          bash scripts/master.sh compile "${{ inputs.clang_version }}" "${{ inputs.defconfig_name }}" kernel "${GITHUB_WORKSPACE}/build.log"

      - name: ccache stats
        if: always()
        run: bash scripts/ccache-summary.sh report

      - name: Make AnyKernel3 zip
        run: |
          ZIP=$(bash scripts/master.sh anykernel "kernel/out/arch/arm64/boot" "${{ inputs.kernel_name }}" "${{ inputs.device_codename }}" "${{ inputs.ksu_type }}" "toolchains/${{ inputs.clang_version }}/bin")
          echo "ZIP_NAME=${ZIP%.zip}" >> "$GITHUB_ENV"

      - name: Collect raw kernel outputs
        if: ${{ inputs.upload_raw_outputs }}
        run: |
          BOOT_DIR="kernel/out/arch/arm64/boot"
          mkdir -p raw-outputs
          for f in Image Image.gz Image.gz-dtb dtb.img dtb dtbo.img; do
            [ -f "$BOOT_DIR/$f" ] && cp "$BOOT_DIR/$f" "raw-outputs/$f"
          done

      - name: Upload raw kernel artifacts
        if: ${{ inputs.upload_raw_outputs }}
        uses: actions/upload-artifact@v7
        with:
          name: kernel-raw-outputs
          path: raw-outputs/*

      - name: Upload kernel zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          device: ${{ inputs.device_codename }}
          branch: ${{ inputs.kernel_branch }}

  Dispatch:
    needs:
      - notify_start
      - Kernel_CI
    if: ${{ !cancelled() && needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Download kernel zip
        uses: actions/download-artifact@v8
        with:
          name: kernel-zip
          path: kernel_out/

      - name: Notify finish
        run: |
          bash scripts/notify.sh finish '${{ inputs.device_codename }}' '${{ inputs.kernel_name }}' '${{ inputs.clang_version }}' "${{ needs.notify_start.outputs.epoch }}" 'kernel_out/*.zip:${{ inputs.ksu_type }}'

  Cache_Cleanup:
    needs: Kernel_CI
    if: ${{ needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Prune old ccache entries
        run: bash scripts/master.sh prune-ccache "ccache-${{ inputs.device_codename }}-${{ inputs.kernel_branch }}-"
