name: Kernel Build (main)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: Kernel Name
        required: true
        type: string
        default: "XCalibur-XF"

      clang_version:
        description: Type the clang version of ur kernel
        required: true
        type: choice
        options:
          - clang-r596125
          - clang-r416183b
          - clang-3289846
          - clang-r450784e
          - clang-r475365b
          - clang-r487747c
          - clang-r498229b
          - clang-r510928
          - clang-r547379
          - clang-r563880
          - clang-r563880c
          - clang-r574158
          - clang-stable
        default: "clang-r596125"

      kernel_source:
        description: Kernel Source Repo URL
        required: true
        type: string
        default: "https://github.com/"

      kernel_branch:
        description: Kernel Branch
        required: true
        type: string

      defconfig_name:
        description: Defconfig Name
        required: true
        type: string

      device_codename:
        description: Device Codename
        required: true
        type: string
        default: "violet"

      ksu_type:
        description: KernelSU
        required: false
        type: choice
        options:
          - None
          - KernelSU
          - ReSukiSU
        default: KernelSU

      BUILD_COMMIT:
        description: Any new changes that applies as a build note/commit
        required: true
        type: string
        default: "Synced with upstream changes 💯"

      telegram_chat_id:
        description: Telegram Chat ID
        required: false
        type: string

      telegram_bot_token:
        description: Telegram Bot Token
        required: false
        type: string

env:
  TZ: "Africa/Lagos"

jobs:
  Kernel_CI:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      checks: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Export Secrets and Vars
        run: |
          TG_CHAT="${{ inputs.telegram_chat_id }}"
          TG_TOKEN="${{ inputs.telegram_bot_token }}"

          if [ -z "$TG_CHAT" ]; then
            TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi
          if [ -z "$TG_TOKEN" ]; then
            TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          fi

          echo "TELEGRAM_CHAT_ID=${TG_CHAT}" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${TG_TOKEN}" >> $GITHUB_ENV

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ inputs.device_codename }}
          max-size: 5G

      - name: Start Time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          bash scripts/master.sh deps
      - name: Clone Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_source }} kernel

      - name: Prepare Metadata
        run: |
          echo "KERNEL_VER=$(cd kernel && make kernelversion)" >> $GITHUB_ENV

          if [[ "${{ inputs.ksu_type }}" != "None"* ]]; then
            git clone --depth=1 https://github.com/Justadeayo/KernelSU.git KSU_REPO
          fi

          cd KSU_REPO
          KSU_LOG=$(git log -1 --format="%s" | tr -d '"\n')
          KSU_HASH=$(git rev-parse --short HEAD)
          cd ..

          echo "LAST_KSU_COMMIT=${KSU_LOG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${KSU_HASH}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ inputs.BUILD_COMMIT }}" >> $GITHUB_ENV

      - name: Send Build Start Message
        run: |
          START_MSG="🛠 *${{ inputs.kernel_name }} Kernel Build Started!*

          *Device*: \`${{ inputs.device_codename }}\`
          *Root Variant*: \`${{ inputs.ksu_type }}\`
          *Status*: Compilation in progress..."

          bash scripts/master.sh tg-msg "${START_MSG}"

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchains/${{ inputs.clang_version }}
          key: clang-${{ inputs.clang_version }}

      - name: Download AOSP Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          bash scripts/master.sh clang "${{ inputs.clang_version }}" "toolchains/${{ inputs.clang_version }}"
      - name: Setup KernelSU & Configure Defconfig
        run: |
          case "${{ inputs.ksu_type }}" in
            ReSukiSU*) URL="https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/RKSU/kernel/setup.sh" ;;
            *)         URL="https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh" ;;
          esac
          bash scripts/master.sh ksu-setup kernel "${{ inputs.ksu_type }}" "arch/arm64/configs/${{ inputs.defconfig_name }}" "$URL"
      - name: Compile Kernel
        run: |
          bash scripts/master.sh compile "${{ inputs.clang_version }}" "${{ inputs.defconfig_name }}" kernel "${GITHUB_WORKSPACE}/build.log"
      - name: Make AnyKernel3
        run: |
          ZIP=$(bash scripts/master.sh anykernel "kernel/out/arch/arm64/boot" "${{ inputs.kernel_name }}" "${{ inputs.device_codename }}" "${{ inputs.ksu_type }}" "toolchains/${{ inputs.clang_version }}/bin")
          echo "ZIP_NAME=${ZIP%.zip}" >> $GITHUB_ENV
      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Send Build Files and Summary via Telegram
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          FILE_SIZE=$(du -sh "$ZIP_FILE" | cut -f1)

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            curl -sX POST -F document=@"${ZIP_FILE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=⚡ *Kernel Flashable Zip*"
          fi

          K_NAME_UPPER=$(echo "${{ inputs.kernel_name }}" | sed 's/./& /g' | tr '[:lower:]' '[:upper:]')

          SUCCESS_MSG="=============================
            ${K_NAME_UPPER}  -  K E R N E L
          =============================

          *Developer*: @Justus26🪖
          *Device*: \`${{ inputs.device_codename }}\`
          *Linux Ver*: \`${{ env.KERNEL_VER }}\`
          *Compiler*: \`${{ inputs.clang_version }}\`
          *Root*: \`${{ inputs.ksu_type }}\`
          *Size*: \`${FILE_SIZE}\`
          *Duration*: \`${MINS}m ${SECS}s\`
          *Date*: \`$(date +'%Y-%m-%d %H:%M WAT')\`"

          bash scripts/master.sh tg-msg "${SUCCESS_MSG}"

      - name: Send Build Failure Message & Logs
        if: failure()
        run: |
          bash scripts/master.sh fail-report "${GITHUB_WORKSPACE}/build.log" "${{ inputs.device_codename }}" "${{ inputs.ksu_type }}" "${BUILD_START:-0}"
  Cache_Cleanup:
    needs: Kernel_CI
    if: ${{ needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Prune old ccache entries
        run: |
          bash scripts/master.sh prune-ccache "ccache-kernel-${{ inputs.device_codename }}"