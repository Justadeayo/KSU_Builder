name: Kernel & Manager Build

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: Kernel Name
        required: true
        type: string
        default: "XCalibur-XF"

      clang_version:
        description: Type the clang version of ur kernel
        required: true
        type: choice
        options:
          - clang-r416183b
          - clang-3289846
          - clang-r450784e
          - clang-r475365b
          - clang-r487747c
          - clang-r498229b
          - clang-r510928
          - clang-r547379
          - clang-r563880
          - clang-r563880c
          - clang-r574158
          - clang-r596125
          - clang-stable
        default: "clang-r596125"

      kernel_source:
        description: Kernel Source Repo URL
        required: true
        type: string
        default: "https://github.com/"

      kernel_branch:
        description: Kernel Branch
        required: true
        type: string

      defconfig_name:
        description: Defconfig Name
        required: true
        type: string
        default: "vendor/"

      device_codename:
        description: Device Codename
        required: true
        type: string
        default: "violet"

      ksu_type:
        description: KernelSU Version
        required: false
        type: choice
        options:
          - None
          - KernelSU
        default: KernelSU

      BUILD_COMMIT:
        description: Any new changes that applies as a build note/commit
        required: true
        type: string
        default: "Synced with upstream changes 💯"

      telegram_chat_id:
        description: Telegram Chat ID
        required: false
        type: string

      telegram_bot_token:
        description: Telegram Bot Token
        required: false
        type: string

env:
  TZ: "Africa/Lagos"

jobs:
  build-manager:
    if: ${{ inputs.ksu_type == 'KernelSU' }}
    uses: Justadeayo/KSU_Builder/.github/workflows/build-manager.yml@dev
    with:
      telegram_chat_id: ${{ inputs.telegram_chat_id }}
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}

  notify_start:
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.start.outputs.epoch }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - id: start
        run: echo "epoch=$(bash scripts/notify.sh start '${{ inputs.device_codename }}' '${{ inputs.kernel_name }}' '${{ inputs.ksu_type == 'Uni-SU' && 'Universal' || inputs.ksu_type == 'None' && 'None' || 'KernelSU' }}' '${{ inputs.clang_version }}')" >> "$GITHUB_OUTPUT"

  Kernel_CI:
    needs: notify_start
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/justadeayo/xcalibur-build-env:ubuntu-24.04-clang-r596125
      options: --cap-add=SYS_ADMIN
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
      checks: read
      packages: read
    outputs:
      kernel_ver: ${{ steps.stats.outputs.kernel_ver }}
      duration: ${{ steps.stats.outputs.duration }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Export Secrets and Vars
        run: |
          TG_CHAT="${{ inputs.telegram_chat_id }}"
          TG_TOKEN="${{ inputs.telegram_bot_token }}"
          
          if [ -z "$TG_CHAT" ]; then
            TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
          fi
          if [ -z "$TG_TOKEN" ]; then
            TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          fi
          
          echo "TELEGRAM_CHAT_ID=${TG_CHAT}" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=${TG_TOKEN}" >> $GITHUB_ENV

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        continue-on-error: true
        with:
          swap-size-gb: 16

      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          device: ${{ inputs.device_codename }}
          branch: ${{ inputs.kernel_branch }}

      - name: Clone Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_source }} kernel

      - name: Prepare Metadata
        run: |
          echo "KERNEL_VER=$(cd kernel && make kernelversion)" >> $GITHUB_ENV
          
          git clone --depth=1 https://github.com/Justadeayo/KernelSU.git KSU_REPO
          cd KSU_REPO
          KSU_LOG=$(git log -1 --format="%s" | tr -d '"\n')
          KSU_HASH=$(git rev-parse --short HEAD)
          cd ..
          
          echo "LAST_KSU_COMMIT=${KSU_LOG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${KSU_HASH}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ inputs.BUILD_COMMIT }}" >> $GITHUB_ENV

      - name: Prepare clang
        run: |
          V="${{ inputs.clang_version }}"
          mkdir -p toolchains
          if [ -x "/opt/toolchains/$V/bin/clang" ]; then
            ln -sfn "/opt/toolchains/$V" "toolchains/$V"
          else
            bash scripts/master.sh clang "$V" "toolchains/$V"
          fi
      - name: Setup KernelSU & Configure Defconfig
        run: |
          bash scripts/master.sh ksu-setup kernel "${{ inputs.ksu_type }}" "arch/arm64/configs/${{ inputs.defconfig_name }}" "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh" master
      - name: Compile Kernel
        env:
          REQUIRE_KSU_TAMPER: ${{ inputs.ksu_type == 'KernelSU' }}
        run: |
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_NOHASHDIR=1
          bash scripts/master.sh compile "${{ inputs.clang_version }}" "${{ inputs.defconfig_name }}" kernel "${GITHUB_WORKSPACE}/build.log"
      - name: ccache stats
        if: always()
        run: CCACHE_DIR="$HOME/.ccache" ccache -s || true
      - name: Make AnyKernel3
        run: |
          ZIP=$(bash scripts/master.sh anykernel "kernel/out/arch/arm64/boot" "${{ inputs.kernel_name }}" "${{ inputs.device_codename }}" "${{ inputs.ksu_type }}" "toolchains/${{ inputs.clang_version }}/bin")
          echo "ZIP_NAME=${ZIP%.zip}" >> $GITHUB_ENV
      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Record Build Stats
        id: stats
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START))
          echo "duration=$((DURATION / 60))m $((DURATION % 60))s" >> $GITHUB_OUTPUT
          echo "kernel_ver=${KERNEL_VER}" >> $GITHUB_OUTPUT

      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          device: ${{ inputs.device_codename }}
          branch: ${{ inputs.kernel_branch }}

  Dispatch:
    needs:
      - notify_start
      - build-manager
      - Kernel_CI
    if: ${{ !cancelled() && needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Download Kernel ZIP
        uses: actions/download-artifact@v8
        with:
          name: kernel-zip
          path: kernel_out/

      - name: Download Manager Artifact
        if: ${{ inputs.ksu_type == 'KernelSU' && needs.build-manager.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: manager
          path: manager_out/

      - name: Notify finish
        run: |
          bash scripts/notify.sh finish '${{ inputs.device_codename }}' '${{ inputs.kernel_name }}' '${{ inputs.clang_version }}' "${{ needs.notify_start.outputs.epoch }}" 'kernel_out/*.zip:${{ inputs.ksu_type == 'Uni-SU' && 'Universal' || inputs.ksu_type == 'None' && 'None' || 'KernelSU' }}' 'manager_apk/*.apk:Manager APK'

  Cache_Cleanup:
    needs: Kernel_CI
    if: ${{ needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Prune old ccache entries
        run: |
          bash scripts/master.sh prune-ccache "ccache-${{ inputs.device_codename }}-${{ inputs.kernel_branch }}-"