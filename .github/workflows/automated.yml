name: Automated Build for Violet

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

env:
  TZ: "Africa/Lagos"
  CLANG_VERSION: "clang-r596125"
  KERNEL_SOURCE: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"
  KERNEL_BRANCH: "17"
  DEFCONFIG_NAME: "vendor/xcalibur-perf_defconfig"
  DEVICE_CODENAME: "violet"
  BUILD_COMMIT: "Synced with upstream changes 💯"
  KERNEL_NAME: "XCalibur-XF"

jobs:
  sync:
    uses: ./.github/workflows/sync.yml
    secrets: inherit
    permissions:
      contents: write
      actions: write

  build-manager:
    needs: sync
    uses: Justadeayo/KSU_Builder/.github/workflows/build-manager.yml@dev

  notify_start:
    runs-on: ubuntu-24.04
    outputs:
      epoch: ${{ steps.start.outputs.epoch }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - id: start
        run: echo "epoch=$(bash scripts/notify.sh start '${{ env.DEVICE_CODENAME }}' '${{ env.KERNEL_NAME }}' 'KernelSU' '${{ env.CLANG_VERSION }}')" >> "$GITHUB_OUTPUT"

  Kernel_CI:
    env:
      TZ: "Africa/Lagos"
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    needs: notify_start
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/justadeayo/xcalibur-build-env:ubuntu-24.04-clang-r596125
      options: --cap-add=SYS_ADMIN
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      actions: read
      checks: read
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        continue-on-error: true
        with:
          swap-size-gb: 16

      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          device: ${{ env.DEVICE_CODENAME }}
          branch: ${{ env.KERNEL_BRANCH }}

      - name: Clone Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel

      - name: Prepare Metadata
        run: |
          echo "KERNEL_VER=$(cd kernel && make kernelversion)" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/Justadeayo/KernelSU.git KSU_REPO
          cd KSU_REPO
          KSU_LOG=$(git log -1 --format="%s" | tr -d '"\n')
          KSU_HASH=$(git rev-parse --short HEAD)
          cd ..

          echo "LAST_KSU_COMMIT=${KSU_LOG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${KSU_HASH}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ env.BUILD_COMMIT }}" >> $GITHUB_ENV

      - name: Prepare clang
        run: |
          V="${{ env.CLANG_VERSION }}"
          mkdir -p toolchains
          if [ -x "/opt/toolchains/$V/bin/clang" ]; then
            ln -sfn "/opt/toolchains/$V" "toolchains/$V"
          else
            bash scripts/master.sh clang "$V" "toolchains/$V"
          fi
      - name: Setup KernelSU & Configure Defconfig
        run: |
          bash scripts/master.sh ksu-setup kernel KernelSU "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh"
      - name: Compile Kernel
        env:
          REQUIRE_KSU_TAMPER: true
        run: |
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=5G CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_NOHASHDIR=1
          bash scripts/master.sh compile "${{ env.CLANG_VERSION }}" "${{ env.DEFCONFIG_NAME }}" kernel "${GITHUB_WORKSPACE}/build.log"
      - name: ccache stats
        if: always()
        run: CCACHE_DIR="$HOME/.ccache" ccache -s || true
      - name: Make AnyKernel3
        run: |
          ZIP=$(bash scripts/master.sh anykernel "kernel/out/arch/arm64/boot" "${{ env.KERNEL_NAME }}" "${{ env.DEVICE_CODENAME }}" "KernelSU" "toolchains/${{ env.CLANG_VERSION }}/bin")
          echo "ZIP_NAME=${ZIP%.zip}" >> $GITHUB_ENV
      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Save ccache
        if: always()
        uses: ./.github/actions/ccache-save
        with:
          device: ${{ env.DEVICE_CODENAME }}
          branch: ${{ env.KERNEL_BRANCH }}

  Dispatch:
    needs:
      - notify_start
      - build-manager
      - Kernel_CI
    if: ${{ !cancelled() && needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Download Kernel ZIP
        uses: actions/download-artifact@v8
        with:
          name: kernel-zip
          path: kernel_out/

      - name: Download Manager Artifact
        if: ${{ needs.build-manager.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: manager
          path: manager_apk/

      - name: Notify finish
        run: |
          bash scripts/notify.sh finish '${{ env.DEVICE_CODENAME }}' '${{ env.KERNEL_NAME }}' '${{ env.CLANG_VERSION }}' "${{ needs.notify_start.outputs.epoch }}" 'kernel_out/*.zip:KernelSU' 'manager_apk/*.apk:Manager APK'

  Cache_Cleanup:
    needs: Kernel_CI
    if: ${{ needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Prune old ccache entries
        run: |
          bash scripts/master.sh prune-ccache "ccache-${{ env.DEVICE_CODENAME }}-${{ env.KERNEL_BRANCH }}-"