name: Automated Build for Violet

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

env:
  TZ: "Africa/Lagos"
  CLANG_VERSION: "clang-r416183b"
  KERNEL_SOURCE: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"
  KERNEL_BRANCH: "17"
  DEFCONFIG_NAME: "vendor/violet-perf_defconfig"
  DEVICE_CODENAME: "violet"
  BUILD_COMMIT: "Synced with upstream changes 💯"
  KERNEL_NAME: "Xcalibur"

jobs:
  build-manager:
    uses: Justadeayo/KSU_Builder/.github/workflows/build-manager.yml@dev

  Kernel_CI:
    env:
      TZ: "Africa/Lagos"
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      checks: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE_CODENAME }}
          max-size: 5G

      - name: Start Time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo apt-get -o Acquire::Timeout="5" -o Acquire::Retries="0" update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip

      - name: Clone Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel

      - name: Prepare Metadata
        run: |
          echo "KERNEL_VER=$(cd kernel && make kernelversion)" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/Justadeayo/KernelSU.git KSU_REPO
          cd KSU_REPO
          KSU_LOG=$(git log -1 --format="%s" | tr -d '"\n')
          KSU_HASH=$(git rev-parse --short HEAD)
          cd ..

          echo "LAST_KSU_COMMIT=${KSU_LOG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${KSU_HASH}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ env.BUILD_COMMIT }}" >> $GITHUB_ENV

      - name: Send Build Start Message
        run: |
          START_MSG="🛠 *${{ env.KERNEL_NAME }} Kernel Build Started!*

          *Device*: \`${{ env.DEVICE_CODENAME }}\`
          *Root*: \`KernelSU\`
          *Compiler*: \`${{ env.CLANG_VERSION }}\`
          *Status*: Compilation in progress..."

          curl -sX POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${START_MSG}"

      - name: Download AOSP Clang
        run: |
          mkdir -p toolchains/${{ env.CLANG_VERSION }}
          cd toolchains

          if [[ "${{ env.CLANG_VERSION }}" == "clang-r416183b" ]]; then
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ${{ env.CLANG_VERSION }}
          else
            OLD_TAGS=("clang-r450784e" "clang-r475365b" "clang-r487747c" "clang-r498229b" "clang-r510928")
            if [[ " ${OLD_TAGS[@]} " =~ " ${{ env.CLANG_VERSION }} " ]]; then
              curl -fLO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r33/${{ env.CLANG_VERSION }}.tar.gz
            else
              curl -fLO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-qpr2-release/${{ env.CLANG_VERSION }}.tar.gz
            fi
            tar -xf "${{ env.CLANG_VERSION }}.tar.gz" -C ${{ env.CLANG_VERSION }}
          fi
          cd ..

          if [ ! -x "toolchains/${{ env.CLANG_VERSION }}/bin/clang" ]; then
            echo "::error::clang binary missing after fetching ${{ env.CLANG_VERSION }} — download or extraction failed."
            exit 1
          fi

      - name: Setup KernelSU & Configure Defconfig
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          curl -LSs "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh" > setup.sh
          sed -i 's|backslashxx/KernelSU|Justadeayo/KernelSU|g' setup.sh
          bash setup.sh master

          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG"
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> "$DEFCONFIG"

      - name: Compile Kernel
        run: |
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${{ env.CLANG_VERSION }}/bin"
          export PATH="/usr/lib/ccache:${CLANG_ROOT}:$PATH"
          export CC="ccache ${CLANG_ROOT}/clang"
          export CXX="ccache ${CLANG_ROOT}/clang++"
          export HOSTCC="ccache ${CLANG_ROOT}/clang"
          export HOSTCXX="ccache ${CLANG_ROOT}/clang++"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          cd kernel
          mkdir -p out

          touch ./.scmversion
          make O=out ${{ env.DEFCONFIG_NAME }} CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out olddefconfig CLANG_TRIPLE=aarch64-linux-gnu-

          echo "---------- KSU options in final .config ----------"
          grep "KSU" out/.config || true
          echo "--------------------------------------------------"

          if ! grep -q "^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" out/.config; then
            echo "::error::CONFIG_KSU_TAMPER_SYSCALL_TABLE is not enabled in the final .config — su hooks would be missing, root would fail. Aborting."
            exit 1
          fi

          set +e
          make -j$(nproc) O=out CLANG_TRIPLE=aarch64-linux-gnu- 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Kernel compilation failed!"
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="${{ env.KERNEL_NAME }}_${{ env.DEVICE_CODENAME }}_KernelSU_$(date +"%Y%m%d_%H%M")"
          BOOT_DIR="kernel/out/arch/arm64/boot"

          git clone -b master https://github.com/Justadeayo/AnyKernel3.git

          if [ -f $BOOT_DIR/Image.gz ]; then
            cp $BOOT_DIR/Image.gz AnyKernel3/Image.gz
          elif [ -f $BOOT_DIR/Image.gz-dtb ]; then
            cp $BOOT_DIR/Image.gz-dtb AnyKernel3/Image.gz-dtb
          fi

          if [ -f $BOOT_DIR/dtb.img ]; then
            cp $BOOT_DIR/dtb.img AnyKernel3/dtb
          elif [ -f $BOOT_DIR/dtb ]; then
            cp $BOOT_DIR/dtb AnyKernel3/dtb
          fi

          if [ -f $BOOT_DIR/dtbo.img ]; then
            cp $BOOT_DIR/dtbo.img AnyKernel3/dtbo.img
          fi

          cd AnyKernel3
          sed -i "s/device.name1=.*/device.name1=${{ env.DEVICE_CODENAME }}/" anykernel.sh

          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/${{ env.CLANG_VERSION }}/bin"
          CLANG_VER=$("${CLANG_ROOT}/clang" --version | head -n1 | sed 's/(https.*//' | sed 's/ version//' | xargs)
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M WAT')

          sed -i "s|ksu_supported=false|ksu_supported=true|" anykernel.sh
          sed -i "s|##CLANG_VERSION##|${CLANG_VER}|" anykernel.sh
          sed -i "s|##BUILD_DATE##|${BUILD_DATE}|" anykernel.sh

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Send Build Completion Message
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          FILE_SIZE=$(du -sh "$ZIP_FILE" | cut -f1)

          K_NAME_UPPER=$(echo "${{ env.KERNEL_NAME }}" | sed 's/./& /g' | tr '[:lower:]' '[:upper:]')

          SUCCESS_MSG="=============================
            ${K_NAME_UPPER}  -  K E R N E L
          =============================

          *Developer*: @Justus26🪖
          *Device*: \`${{ env.DEVICE_CODENAME }}\`
          *Linux Ver*: \`${{ env.KERNEL_VER }}\`
          *Compiler*: \`${{ env.CLANG_VERSION }}\`
          *Root*: \`KernelSU\`
          *Size*: \`${FILE_SIZE}\`
          *Duration*: \`${MINS}m ${SECS}s\`
          *Date*: \`$(date +'%Y-%m-%d %H:%M WAT')\`

          Download APK and Zip from latest Release on https://github.com/Justadeayo/KernelSU/releases"

          curl -sX POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${SUCCESS_MSG}"

      - name: Send Build Failure Message & Logs
        if: failure()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - BUILD_START))
          MINS=$((DURATION / 60))
          SECS=$((DURATION % 60))

          if [ -f "${GITHUB_WORKSPACE}/build.log" ]; then
            tail -n 35 "${GITHUB_WORKSPACE}/build.log" > "${GITHUB_WORKSPACE}/error_preview.txt"
            zip -j "${GITHUB_WORKSPACE}/error_logs.zip" "${GITHUB_WORKSPACE}/build.log" "${GITHUB_WORKSPACE}/error_preview.txt"
          fi

          FAIL_MSG="*Build Failed!* ❌

          *Device*: \`${{ env.DEVICE_CODENAME }}\`
          *Root*: \`KernelSU\`
          *Compiler*: \`${{ env.CLANG_VERSION }}\`
          *Duration*: \`${MINS}m ${SECS}s\`
          *Run Link*: [View Actions Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [ -f "${GITHUB_WORKSPACE}/error_logs.zip" ]; then
            curl -sX POST -F document=@"${GITHUB_WORKSPACE}/error_logs.zip" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=${FAIL_MSG}"
          else
            curl -sX POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text=${FAIL_MSG}"
          fi
