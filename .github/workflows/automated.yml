name: Automated Build for Violet

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

env:
  TZ: "Africa/Lagos"
  CLANG_VERSION: "clang-r596125"
  KERNEL_SOURCE: "https://github.com/Justadeayo/android_kernel_xiaomi_violet"
  KERNEL_BRANCH: "17"
  DEFCONFIG_NAME: "vendor/xcalibur-perf_defconfig"
  DEVICE_CODENAME: "violet"
  BUILD_COMMIT: "Synced with upstream changes 💯"
  KERNEL_NAME: "XCalibur-XF"

jobs:
  build-manager:
    uses: Justadeayo/KSU_Builder/.github/workflows/build-manager.yml@dev

  Kernel_CI:
    env:
      TZ: "Africa/Lagos"
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      checks: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE_CODENAME }}
          max-size: 5G

      - name: Start Time
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          bash scripts/master.sh deps
      - name: Clone Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel

      - name: Prepare Metadata
        run: |
          echo "KERNEL_VER=$(cd kernel && make kernelversion)" >> $GITHUB_ENV

          git clone --depth=1 https://github.com/Justadeayo/KernelSU.git KSU_REPO
          cd KSU_REPO
          KSU_LOG=$(git log -1 --format="%s" | tr -d '"\n')
          KSU_HASH=$(git rev-parse --short HEAD)
          cd ..

          echo "LAST_KSU_COMMIT=${KSU_LOG}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${KSU_HASH}" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${{ env.BUILD_COMMIT }}" >> $GITHUB_ENV

      - name: Send Build Start Message
        run: |
          START_MSG="🛠 *${{ env.KERNEL_NAME }} Kernel Build Started!*

          *Device*: \`${{ env.DEVICE_CODENAME }}\`
          *Root*: \`KernelSU\`
          *Compiler*: \`${{ env.CLANG_VERSION }}\`
          *Status*: Compilation in progress..."

          bash scripts/master.sh tg-msg "${START_MSG}"

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download AOSP Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          bash scripts/master.sh clang "${{ env.CLANG_VERSION }}" "toolchains/${{ env.CLANG_VERSION }}"
      - name: Setup KernelSU & Configure Defconfig
        run: |
          bash scripts/master.sh ksu-setup kernel KernelSU "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}" "https://raw.githubusercontent.com/Justadeayo/KernelSU/refs/heads/master/kernel/setup.sh"
      - name: Compile Kernel
        env:
          REQUIRE_KSU_TAMPER: true
        run: |
          bash scripts/master.sh compile "${{ env.CLANG_VERSION }}" "${{ env.DEFCONFIG_NAME }}" kernel "${GITHUB_WORKSPACE}/build.log"
      - name: Make AnyKernel3
        run: |
          ZIP=$(bash scripts/master.sh anykernel "kernel/out/arch/arm64/boot" "${{ env.KERNEL_NAME }}" "${{ env.DEVICE_CODENAME }}" "KernelSU" "toolchains/${{ env.CLANG_VERSION }}/bin")
          echo "ZIP_NAME=${ZIP%.zip}" >> $GITHUB_ENV
      - name: Upload Kernel ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-zip
          path: "*.zip"

      - name: Send Build Failure Message & Logs
        if: failure()
        run: |
          bash scripts/master.sh fail-report "${GITHUB_WORKSPACE}/build.log" "${{ env.DEVICE_CODENAME }}" "KernelSU" "${BUILD_START:-0}"
  Dispatch:
    needs:
      - build-manager
      - Kernel_CI
    if: ${{ !cancelled() && needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Download Kernel ZIP
        uses: actions/download-artifact@v8
        with:
          name: kernel-zip
          path: kernel_out/

      - name: Download Manager Artifact
        if: ${{ needs.build-manager.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: manager
          path: manager_apk/

      - name: Dispatch Builds to Telegram
        run: |
          ZIP_FILE=$(find kernel_out -name "*.zip" | head -n 1)
          APK_FILE=$(find manager_apk -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            curl -sX POST -F document=@"${APK_FILE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=📱 *KernelSU Manager APK Build*"
          else
            echo "::warning::No manager APK found - build-manager result was '${{ needs.build-manager.result }}'"
          fi

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            curl -sX POST -F document=@"${ZIP_FILE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "parse_mode=Markdown" \
              -F "caption=📦 *${{ env.KERNEL_NAME }} Kernel Zip Build*"
          fi

  Cache_Cleanup:
    needs: Kernel_CI
    if: ${{ needs.Kernel_CI.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune old ccache entries
        run: |
          bash scripts/master.sh prune-ccache "ccache-kernel-${{ env.DEVICE_CODENAME }}"